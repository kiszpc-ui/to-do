function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function toLocal(d){const o=d.getTimezoneOffset()*60000;return new Date(d-o).toISOString().slice(0,10);}
function todayISO(){return toLocal(new Date());}
function diffDays(ds){
  if(!ds)return null;
  const d=new Date(ds+"T00:00:00"),t=new Date();t.setHours(0,0,0,0);
  return Math.ceil((d-t)/86400000);
}

function nextDeadline(deadline,rType,rVal){
  if(!deadline||!rType)return null;
  const base=new Date(deadline+"T00:00:00");
  const today=new Date();today.setHours(0,0,0,0);
  if(rType==="weekly"){
    const d=new Date(base);
    do{d.setDate(d.getDate()+7);}while(d<=today);
    return toLocal(d);
  }
  if(rType==="monthly"){
    const tgt=base.getDate();
    let y=base.getFullYear(),m=base.getMonth();
    for(let i=1;i<=24;i++){
      m++;if(m>11){m=0;y++;}
      const last=new Date(y,m+1,0).getDate();
      const d=new Date(y,m,Math.min(tgt,last));
      if(d>today)return toLocal(d);
    }
    return null;
  }
  if(rType==="custom"){
    const rv=rVal||"";
    if(rv.startsWith("ndays:")){const n=parseInt(rv.split(":")[1])||1;const d=new Date(base);do{d.setDate(d.getDate()+n);}while(d<=today);return toLocal(d);}
    if(rv.startsWith("nweeks:")){const n=parseInt(rv.split(":")[1])||1;const d=new Date(base);do{d.setDate(d.getDate()+n*7);}while(d<=today);return toLocal(d);}
    if(rv.startsWith("nmonths:")){
      const n=parseInt(rv.split(":")[1])||1;const tgt=base.getDate();
      let y=base.getFullYear(),m=base.getMonth();
      for(let i=0;i<24;i++){
        m+=n;while(m>11){m-=12;y++;}
        const last=new Date(y,m+1,0).getDate();
        const d=new Date(y,m,Math.min(tgt,last));
        if(d>today)return toLocal(d);
      }
      return null;
    }
    if(rv.startsWith("nth:")){
      const p=rv.split(":");const nthW=parseInt(p[1]),wd=parseInt(p[2]);
      let y=base.getFullYear(),m=base.getMonth();
      for(let i=1;i<=24;i++){
        m++;if(m>11){m=0;y++;}
        let cnt=0;
        for(let d=0;d<31;d++){
          const dd=new Date(y,m,1+d);
          if(dd.getMonth()!==m)break;
          if(dd.getDay()===wd){if(cnt===nthW){if(dd>today)return toLocal(dd);break;}cnt++;}
        }
      }
      return null;
    }
    const days=rv.split(",").map(Number).filter(n=>!isNaN(n));
    if(days.length===0)return null;
    const d=new Date(today);d.setDate(d.getDate()+1);
    for(let i=0;i<14;i++){if(days.includes(d.getDay()))return toLocal(d);d.setDate(d.getDate()+1);}
  }
  return null;
}

function repeatLabel(rType,rVal){
  if(!rType)return null;
  if(rType==="weekly")return "毎週";
  if(rType==="monthly")return "毎月";
  if(rType==="custom"){
    const rv=rVal||"";
    if(rv.startsWith("ndays:"))return `${rv.split(":")[1]}日毎`;
    if(rv.startsWith("nweeks:"))return `${rv.split(":")[1]}週毎`;
    if(rv.startsWith("nmonths:"))return `${rv.split(":")[1]}ヶ月毎`;
    if(rv.startsWith("nth:")){const p=rv.split(":");return `第${parseInt(p[1])+1}週の${WD[parseInt(p[2])]}曜日`;}
    const days=rv.split(",").map(Number).filter(n=>!isNaN(n));
    if(days.length>0)return "毎週"+days.map(d=>WD[d]).join("・");
  }
  return null;
}

function isRepeatOnDate(startDate,rType,rVal,checkDate,excludeDates,repeatEndDate){
  if(excludeDates&&excludeDates.split(",").includes(checkDate))return false;
  if(repeatEndDate&&checkDate>repeatEndDate)return false;
  if(!rType)return startDate===checkDate;
  const base=new Date(startDate+"T00:00:00");
  const check=new Date(checkDate+"T00:00:00");
  if(check<base)return false;
  if(check.getTime()===base.getTime())return true;
  const diffD=Math.round((check-base)/86400000);
  if(rType==="weekly")return diffD%7===0;
  if(rType==="monthly"){
    const tgt=base.getDate();
    const last=new Date(check.getFullYear(),check.getMonth()+1,0).getDate();
    return check.getDate()===Math.min(tgt,last)&&(check.getFullYear()!==base.getFullYear()||check.getMonth()!==base.getMonth());
  }
  if(rType==="custom"){
    const rv=rVal||"";
    if(rv.startsWith("ndays:")){const n=parseInt(rv.split(":")[1])||1;return diffD%n===0;}
    if(rv.startsWith("nweeks:")){const n=parseInt(rv.split(":")[1])||1;return diffD%(n*7)===0;}
    if(rv.startsWith("nmonths:")){
      const n=parseInt(rv.split(":")[1])||1;
      const mDiff=(check.getFullYear()-base.getFullYear())*12+(check.getMonth()-base.getMonth());
      if(mDiff<=0||mDiff%n!==0)return false;
      const tgt=base.getDate();const last=new Date(check.getFullYear(),check.getMonth()+1,0).getDate();
      return check.getDate()===Math.min(tgt,last);
    }
    if(rv.startsWith("nth:")){
      const p=rv.split(":");const nthW=parseInt(p[1]),wd=parseInt(p[2]);
      if(check.getDay()!==wd)return false;
      return Math.floor((check.getDate()-1)/7)===nthW;
    }
    const days=rv.split(",").map(Number).filter(n=>!isNaN(n));
    return days.includes(check.getDay());
  }
  return false;
}

const STEPS=["現調","仕様決め","見積依頼","見積取得","仕様確認","伺書作成回覧","伺書戻り","工場依頼書作成回覧","工場依頼書戻り","工事日程・納期調整","発注","着工","完了","検修","請求書処理"];
const WD_JP=["日","月","火","水","木","金","土"];

function ProjectListView({SB,uid,items,setItems,steps,setSteps}){
  const {useState,useEffect,useRef}=React;
  const [expanded,setExpanded]=useState(null);
  const [editItem,setEditItem]=useState(null);
  const [stepDates,setStepDates]=useState(null);
  const [datePopup,setDatePopup]=useState(null); // {itemId,stepIdx,currentDate}
  const [dateInput,setDateInput]=useState("");
  const [sortedIds,setSortedIds]=useState([]);
  const [animating,setAnimating]=useState(false);

  // 初期ソート
  useEffect(()=>{
    setSortedIds(getSortedIds(items,steps));
  },[items,steps]);

  const getSortedIds=(its,sts)=>{
    return [...its].sort((a,b)=>{
      const aIdx=getNextIdx(a.id,sts);
      const bIdx=getNextIdx(b.id,sts);
      const aRec=aIdx!==null?(sts[a.id]||[]).find(s=>s.step_index===aIdx):null;
      const bRec=bIdx!==null?(sts[b.id]||[]).find(s=>s.step_index===bIdx):null;
      const aDate=aRec?.planned_date?aRec.planned_date:"9999";
      const bDate=bRec?.planned_date?bRec.planned_date:"9999";
      return aDate.localeCompare(bDate);
    }).map(x=>x.id);
  };

  const getNextIdx=(id,sts=steps)=>{
    const done=(sts[id]||[]).filter(s=>s.done_at).map(s=>s.step_index);
    for(let i=0;i<STEPS.length;i++){if(!done.includes(i))return i;}
    return null;
  };

  const tapStep=async(e,itemId,stepIdx)=>{
    e.stopPropagation();
    const existing=(steps[itemId]||[]).find(s=>s.step_index===stepIdx);
    if(existing&&existing.done_at){setStepDates({itemId,stepIdx});return;}
    const today=new Date().toISOString().slice(0,10);
    if(existing){
      const {error}=await SB.from("project_steps").update({done_at:today}).eq("id",existing.id);
      if(error){alert("エラー:"+error.message);return;}
      setSteps(prev=>({...prev,[itemId]:(prev[itemId]||[]).map(s=>s.id===existing.id?{...s,done_at:today}:s)}));
    }else{
      const newS={id:uid(),task_id:itemId,step_index:stepIdx,done_at:today,planned_date:null};
      const {data,error}=await SB.from("project_steps").insert(newS).select().single();
      if(error){alert("エラー:"+error.message);return;}
      setSteps(prev=>({...prev,[itemId]:[...(prev[itemId]||[]),(data||newS)]}));
    }
  };

  const openDatePopup=(e,itemId,stepIdx)=>{
    e.stopPropagation();
    const rec=(steps[itemId]||[]).find(s=>s.step_index===stepIdx);
    setDateInput(rec?.planned_date||null);
    setDatePopup({itemId,stepIdx});
  };

  const confirmDate=async()=>{
    if(!datePopup)return;
    const {itemId,stepIdx}=datePopup;
    const val=dateInput||"";
    if(!val){setDatePopup(null);return;} // 空のまま決定したら何もしない
    const existing=(steps[itemId]||[]).find(s=>s.step_index===stepIdx);
    let newSteps;
    if(existing){
      const {error}=await SB.from("project_steps").update({planned_date:val||null}).eq("id",existing.id);
      if(error){alert("エラー:"+error.message);return;}
      newSteps={...steps,[itemId]:(steps[itemId]||[]).map(s=>s.id===existing.id?{...s,planned_date:val||null}:s)};
    }else{
      const newS={id:uid(),task_id:itemId,step_index:stepIdx,done_at:null,planned_date:val||null};
      const {data,error}=await SB.from("project_steps").insert(newS).select().single();
      if(error){alert("エラー:"+error.message);return;}
      newSteps={...steps,[itemId]:[...(steps[itemId]||[]),(data||newS)]};
    }
    setSteps(newSteps);
    setDatePopup(null);
    // アニメーションで並び替え
    setAnimating(true);
    setTimeout(()=>{
      setSortedIds(getSortedIds(items,newSteps));
      setTimeout(()=>setAnimating(false),400);
    },100);
  };

  const clearDate=async(e,itemId,stepIdx)=>{
    e.stopPropagation();
    const existing=(steps[itemId]||[]).find(s=>s.step_index===stepIdx);
    if(!existing)return;
    await SB.from("project_steps").update({planned_date:null}).eq("id",existing.id);
    const newSteps={...steps,[itemId]:(steps[itemId]||[]).map(s=>s.id===existing.id?{...s,planned_date:null}:s)};
    setSteps(newSteps);
    setAnimating(true);
    setTimeout(()=>{setSortedIds(getSortedIds(items,newSteps));setTimeout(()=>setAnimating(false),400);},100);
  };

  const saveItem=async()=>{
    if(!editItem||!editItem.title?.trim())return;
    if(editItem.id){
      await SB.from("projects_list").update({title:editItem.title.trim(),note:editItem.note||""}).eq("id",editItem.id);
      setItems(prev=>prev.map(x=>x.id===editItem.id?{...x,title:editItem.title.trim(),note:editItem.note||""}:x));
    }else{
      const n={id:uid(),title:editItem.title.trim(),note:editItem.note||""};
      const {error}=await SB.from("projects_list").insert(n);
      if(error){alert("エラー:"+error.message);return;}
      setItems(prev=>[...prev,n]);
    }
    setEditItem(null);
  };

  const deleteItem=async(id)=>{
    if(!confirm("削除しますか？"))return;
    await SB.from("project_steps").delete().eq("task_id",id);
    await SB.from("projects_list").delete().eq("id",id);
    setItems(prev=>prev.filter(x=>x.id!==id));
    setSteps(prev=>{const n={...prev};delete n[id];return n;});
  };

  const sortedItems=sortedIds.map(id=>items.find(x=>x.id===id)).filter(Boolean);
  const unsorted=items.filter(x=>!sortedIds.includes(x.id));
  const displayItems=[...sortedItems,...unsorted];

  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
        padding:"8px 12px",borderBottom:"1px solid #e8e8e8",flexShrink:0,background:"#fafafa"}}>
        <span style={{fontSize:11,fontWeight:700,color:"#666"}}>案件管理 {items.length}件</span>
        <button onClick={()=>setEditItem({title:"",note:""})}
          style={{background:"#1a1a1a",color:"#fff",border:"none",borderRadius:20,padding:"4px 12px",fontSize:11,cursor:"pointer"}}>＋案件</button>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"8px 12px 100px"}}>
        {displayItems.map(item=>{
          const itemSteps=steps[item.id]||[];
          const nextIdx=getNextIdx(item.id);
          const isExpanded=expanded===item.id;
          const allDone=nextIdx===null;
          const nextRec=nextIdx!==null?itemSteps.find(s=>s.step_index===nextIdx):null;
          return(
            <div key={item.id}
              style={{background:"#fff",borderRadius:10,marginBottom:8,border:"1px solid #e8e8e8",overflow:"hidden",
              transition:"all 0.5s cubic-bezier(0.4,0,0.2,1)"}}>
              <div style={{display:"flex",alignItems:"center",gap:6,padding:"10px 10px 6px",cursor:"pointer"}}
                onClick={()=>setExpanded(isExpanded?null:item.id)}>
                <span style={{fontSize:12,fontWeight:600,flex:1,color:allDone?"#aaa":"#1a1a1a",
                  textDecoration:allDone?"line-through":"none"}}>{item.title}</span>
                <button onTouchEnd={e=>{e.preventDefault();e.stopPropagation();setEditItem({...item});}}
                  onClick={e=>{e.preventDefault();e.stopPropagation();setEditItem({...item});}}
                  style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#6366f1",padding:"0 6px",flexShrink:0}}>✎</button>
                <span style={{fontSize:18,color:"#6366f1",flexShrink:0}}>{isExpanded?"▲":"▼"}</span>
              </div>
              {!allDone&&nextIdx!==null&&(
                <div style={{padding:"0 10px 8px",display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  <span style={{fontSize:14,color:"#555",flexShrink:0}}>→</span>
                  <button
                    onTouchEnd={e=>{e.preventDefault();tapStep(e,item.id,nextIdx);}}
                    onClick={e=>tapStep(e,item.id,nextIdx)}
                    style={{background:"#1a1a1a",color:"#fff",border:"none",borderRadius:20,
                      padding:"4px 12px",fontSize:10,cursor:"pointer",flexShrink:0}}>
                    {STEPS[nextIdx]}
                  </button>
                  <button
                    onTouchEnd={e=>{e.preventDefault();openDatePopup(e,item.id,nextIdx);}}
                    onClick={e=>openDatePopup(e,item.id,nextIdx)}
                    style={{background:nextRec?.planned_date?"#6366f1":"#f0f0f0",color:nextRec?.planned_date?"#fff":"#aaa",
                      border:"none",borderRadius:20,padding:"4px 10px",fontSize:10,cursor:"pointer",flexShrink:0}}>
                    {nextRec?.planned_date
                      ?(()=>{const d=new Date(nextRec.planned_date+"T00:00:00");return `${d.getMonth()+1}/${d.getDate()}（${WD_JP[d.getDay()]}）`;})()
                      :"予定日"}
                  </button>
                  {nextRec?.planned_date&&<button
                    onTouchEnd={e=>{e.preventDefault();clearDate(e,item.id,nextIdx);}}
                    onClick={e=>clearDate(e,item.id,nextIdx)}
                    style={{background:"#f0f0f0",border:"none",borderRadius:20,padding:"3px 8px",fontSize:10,cursor:"pointer",color:"#999",flexShrink:0}}>×</button>}
                </div>
              )}
              {allDone&&<div style={{padding:"0 10px 10px",fontSize:9,color:"#10b981",fontWeight:600}}>✓ 全ステップ完了</div>}
              {isExpanded&&(
                <div style={{borderTop:"1px solid #f0f0f0",padding:"10px",background:"#fafafa"}}>
                  {item.note&&<div style={{fontSize:10,color:"#888",marginBottom:8,whiteSpace:"pre-wrap"}}>{item.note}</div>}
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {STEPS.map((step,idx)=>{
                      const rec=itemSteps.find(s=>s.step_index===idx);
                      const isDone=!!(rec&&rec.done_at);
                      const isNext=idx===nextIdx;
                      return(
                        <div key={idx} style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                          <button
                            onTouchEnd={e=>{e.preventDefault();tapStep(e,item.id,idx);}}
                            onClick={e=>tapStep(e,item.id,idx)}
                            style={{fontSize:9,padding:"3px 8px",borderRadius:20,border:"none",cursor:"pointer",flexShrink:0,
                              background:isDone?"#1a1a1a":isNext?"#e0e0e0":"#f5f5f5",
                              color:isDone?"#fff":isNext?"#1a1a1a":"#bbb",fontWeight:isNext?700:400}}>
                            {step}
                          </button>
                          <button
                            onTouchEnd={e=>{e.preventDefault();openDatePopup(e,item.id,idx);}}
                            onClick={e=>openDatePopup(e,item.id,idx)}
                            style={{background:rec?.planned_date?"#eef0ff":"#f5f5f5",
                              color:rec?.planned_date?"#6366f1":"#ccc",
                              border:"none",borderRadius:20,padding:"2px 8px",fontSize:9,cursor:"pointer",flexShrink:0}}>
                            {rec?.planned_date?(()=>{const d=new Date(rec.planned_date+"T00:00:00");return `${d.getMonth()+1}/${d.getDate()}（${WD_JP[d.getDay()]}）`;})():"予定日"}
                          </button>
                          {rec?.planned_date&&<button
                            onTouchEnd={e=>{e.preventDefault();clearDate(e,item.id,idx);}}
                            onClick={e=>clearDate(e,item.id,idx)}
                            style={{background:"#f0f0f0",border:"none",borderRadius:20,padding:"1px 6px",fontSize:9,cursor:"pointer",color:"#999",flexShrink:0}}>×</button>}
                          {isDone&&<span style={{fontSize:8,color:"#aaa",flexShrink:0}}>✓{rec.done_at}</span>}
                        </div>
                      );
                    })}
                  </div>
                  <button onClick={()=>deleteItem(item.id)}
                    style={{marginTop:10,fontSize:10,background:"#fff0f0",border:"none",borderRadius:8,
                      padding:"6px 12px",cursor:"pointer",color:"#ef4444"}}>削除</button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* 日付選択ポップアップ */}
      {datePopup&&(
        <div className="dlg-ov" style={{alignItems:"center"}} onClick={()=>setDatePopup(null)}>
          <div className="dlg-in" style={{borderRadius:14,width:"min(280px,90vw)",textAlign:"center"}}
            onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:12}}>予定日を設定</div>
            <div style={{fontSize:11,color:"#aaa",marginBottom:8}}>{STEPS[datePopup.stepIdx]}</div>
            <input type="date" defaultValue={dateInput||""} key={datePopup?.itemId+"-"+datePopup?.stepIdx}
              onChange={e=>setDateInput(e.target.value)}
              style={{width:"100%",border:"1px solid #ddd",borderRadius:8,padding:"10px",
                fontSize:16,outline:"none",boxSizing:"border-box",marginBottom:12,textAlign:"center"}}/>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setDatePopup(null)}
                style={{flex:1,background:"#f0f0f0",border:"none",borderRadius:8,padding:"10px 0",fontSize:12,cursor:"pointer",color:"#666"}}>キャンセル</button>
              <button onClick={confirmDate}
                style={{flex:1,background:"#6366f1",border:"none",borderRadius:8,padding:"10px 0",fontSize:12,cursor:"pointer",color:"#fff",fontWeight:600}}>決定</button>
            </div>
          </div>
        </div>
      )}

      {/* 案件編集モーダル */}
      {editItem&&(
        <div className="dlg-ov" onClick={()=>setEditItem(null)}>
          <div className="dlg-in" onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:12}}>{editItem.id?"案件を編集":"新規案件"}</div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:11,color:"#aaa",marginBottom:4}}>タイトル</div>
              <input value={editItem.title||""} onChange={e=>setEditItem(t=>({...t,title:e.target.value}))}
                placeholder="案件名を入力"
                style={{width:"100%",border:"1px solid #ddd",borderRadius:8,padding:"8px 10px",fontSize:16,outline:"none",boxSizing:"border-box"}}/>
            </div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:11,color:"#aaa",marginBottom:4}}>メモ</div>
              <textarea value={editItem.note||""} onChange={e=>setEditItem(t=>({...t,note:e.target.value}))}
                placeholder="メモを入力" rows={4}
                style={{width:"100%",border:"1px solid #ddd",borderRadius:8,padding:"8px 10px",fontSize:16,outline:"none",boxSizing:"border-box",resize:"vertical",fontFamily:"inherit"}}/>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setEditItem(null)}
                style={{flex:1,background:"#f0f0f0",border:"none",borderRadius:8,padding:"10px 0",fontSize:12,cursor:"pointer",color:"#666"}}>キャンセル</button>
              <button onClick={saveItem}
                style={{flex:1,background:"#1a1a1a",border:"none",borderRadius:8,padding:"10px 0",fontSize:12,cursor:"pointer",color:"#fff",fontWeight:600}}>保存</button>
            </div>
          </div>
        </div>
      )}

      {/* ステップ完了日ポップアップ */}
      {stepDates&&(()=>{
        const {itemId,stepIdx}=stepDates;
        const rec=(steps[itemId]||[]).find(s=>s.step_index===stepIdx);
        return(
          <div className="dlg-ov" style={{alignItems:"center"}} onClick={()=>setStepDates(null)}>
            <div className="dlg-in" style={{borderRadius:14,width:"min(260px,90vw)",textAlign:"center"}}
              onClick={e=>e.stopPropagation()}>
              <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>{STEPS[stepIdx]}</div>
              <div style={{fontSize:12,color:"#888",marginBottom:16}}>完了日: {rec?.done_at||"不明"}</div>
              <button onClick={async()=>{
                if(!confirm("このステップを未完了に戻しますか？"))return;
                await SB.from("project_steps").update({done_at:null}).eq("id",rec.id);
                setSteps(prev=>({...prev,[itemId]:(prev[itemId]||[]).map(s=>s.id===rec.id?{...s,done_at:null}:s)}));
                setStepDates(null);
              }} style={{background:"#fff0f0",border:"none",borderRadius:8,padding:"8px 16px",fontSize:12,cursor:"pointer",color:"#ef4444",marginBottom:8,width:"100%"}}>
                未完了に戻す
              </button>
              <button onClick={()=>setStepDates(null)}
                style={{background:"#f0f0f0",border:"none",borderRadius:8,padding:"8px 16px",fontSize:12,cursor:"pointer",color:"#666",width:"100%"}}>閉じる</button>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

function RepeatSel({rType,setRType,rVal,setRVal}){
  const rv=rVal||"";
  const [mode,setMode]=useState(()=>{
    if(rv.startsWith("ndays:"))return "ndays";
    if(rv.startsWith("nweeks:"))return "nweeks";
    if(rv.startsWith("nmonths:"))return "nmonths";
    if(rv.startsWith("nth:"))return "nth";
    return "weekdays";
  });
  const [nd,setNd]=useState(()=>rv.startsWith("ndays:")?rv.split(":")[1]:"3");
  const [nw,setNw]=useState(()=>rv.startsWith("nweeks:")?rv.split(":")[1]:"2");
  const [nm,setNm]=useState(()=>rv.startsWith("nmonths:")?rv.split(":")[1]:"2");
  const [ntw,setNtw]=useState(()=>rv.startsWith("nth:")?rv.split(":")[1]:"0");
  const [ntd,setNtd]=useState(()=>rv.startsWith("nth:")?rv.split(":")[2]:"1");
  const [sds,setSds]=useState(()=>{
    if(!rv||rv.startsWith("n")||rv.startsWith("nth"))return[];
    return rv.split(",").map(Number).filter(n=>!isNaN(n));
  });
  const upd=(m,_nd,_nw,_nm,_ntw,_ntd,_sds)=>{
    if(rType!=="custom")return;
    if(m==="ndays")setRVal("ndays:"+_nd);
    else if(m==="nweeks")setRVal("nweeks:"+_nw);
    else if(m==="nmonths")setRVal("nmonths:"+_nm);
    else if(m==="nth")setRVal("nth:"+_ntw+":"+_ntd);
    else setRVal(_sds.join(","));
  };
  const bs={border:"1px solid #ddd",borderRadius:6,padding:"4px 6px",fontSize:12,outline:"none",background:"#fff"};
  const inp={border:"1px solid #ddd",borderRadius:6,padding:"4px 6px",fontSize:16,outline:"none",width:52,textAlign:"center"};
  return(
    <div>
      <div style={{fontSize:11,color:"#aaa",marginBottom:6}}>繰り返し</div>
      <select value={rType} onChange={e=>{setRType(e.target.value);setRVal("");}} style={{...bs,width:"100%",marginBottom:8}}>
        <option value="">なし</option><option value="weekly">毎週</option>
        <option value="monthly">毎月</option><option value="custom">カスタム</option>
      </select>
      {rType==="custom"&&<div style={{background:"#f9f9f9",borderRadius:8,padding:10}}>
        <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:10}}>
          {[["weekdays","曜日"],["ndays","◯日毎"],["nweeks","◯週毎"],["nmonths","◯ヶ月毎"],["nth","第◯週"]].map(([m,l])=>(
            <button key={m} onClick={()=>{setMode(m);upd(m,nd,nw,nm,ntw,ntd,sds);}}
              style={{padding:"3px 8px",borderRadius:20,border:`1px solid ${mode===m?"#6366f1":"#ddd"}`,
              background:mode===m?"#6366f118":"transparent",color:mode===m?"#6366f1":"#666",fontSize:11,cursor:"pointer"}}>{l}</button>
          ))}
        </div>
        {mode==="weekdays"&&<div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
          {WD.map((d,i)=>{const on=sds.includes(i);return(
            <button key={i} onClick={()=>{const n=on?sds.filter(x=>x!==i):[...sds,i];setSds(n);upd("weekdays",nd,nw,nm,ntw,ntd,n);}}
              style={{padding:"4px 8px",borderRadius:20,border:`1px solid ${on?"#6366f1":"#ddd"}`,
              background:on?"#6366f118":"transparent",color:on?"#6366f1":"#666",fontSize:11,cursor:"pointer"}}>{d}</button>
          );})}
        </div>}
        {mode==="ndays"&&<div style={{display:"flex",alignItems:"center",gap:6}}>
          <input type="number" min="1" max="365" value={nd} style={inp} onChange={e=>{setNd(e.target.value);upd("ndays",e.target.value,nw,nm,ntw,ntd,sds);}}/>
          <span style={{fontSize:12,color:"#666"}}>日毎</span></div>}
        {mode==="nweeks"&&<div style={{display:"flex",alignItems:"center",gap:6}}>
          <input type="number" min="1" max="52" value={nw} style={inp} onChange={e=>{setNw(e.target.value);upd("nweeks",nd,e.target.value,nm,ntw,ntd,sds);}}/>
          <span style={{fontSize:12,color:"#666"}}>週毎</span></div>}
        {mode==="nmonths"&&<div style={{display:"flex",alignItems:"center",gap:6}}>
          <input type="number" min="1" max="12" value={nm} style={inp} onChange={e=>{setNm(e.target.value);upd("nmonths",nd,nw,e.target.value,ntw,ntd,sds);}}/>
          <span style={{fontSize:12,color:"#666"}}>ヶ月毎</span></div>}
        {mode==="nth"&&<div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
          <select value={ntw} style={bs} onChange={e=>{setNtw(e.target.value);upd("nth",nd,nw,nm,e.target.value,ntd,sds);}}>
            {NTH.map((l,i)=><option key={i} value={i}>{l}週</option>)}
          </select>
          <span style={{fontSize:12,color:"#666"}}>の</span>
          <select value={ntd} style={bs} onChange={e=>{setNtd(e.target.value);upd("nth",nd,nw,nm,ntw,e.target.value,sds);}}>
            {WD.map((d,i)=><option key={i} value={i}>{d}曜日</option>)}
          </select>
        </div>}
      </div>}
    </div>
  );
}

// ---- CalView (2週間/予定のみ) ----
function CalView({tasks,events,proj,daysBack,daysForward,showTasks,onTaskClick,onEventClick,onOverdueClick,scrollToRef,onMemoClick}){
  const today=todayISO();
  const days=[];
  for(let i=-(daysBack||0);i<(daysForward||14);i++){
    const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+i);
    days.push({d,iso:toLocal(d)});
  }
  return(
    <div style={{flex:1,minHeight:0,display:"flex",flexDirection:"column",overflow:"hidden"}}>
    <div style={{flex:1,overflowY:"auto",padding:"0 12px 100px"}}>
      {days.map(({d,iso})=>{
        const isToday=iso===today;
        const isSun=d.getDay()===0,isSat=d.getDay()===6,isHol=!!HOLIDAYS[iso];
        const dc=isToday?"#fff":(isSun||isHol)?"#ef4444":isSat?"#3b82f6":"#1a1a1a";
        const dayTasks=showTasks?tasks.filter(t=>t.deadline===iso).sort((a,b)=>(b.priority||0)-(a.priority||0)):[];
        const dayEvents=(events||[]).filter(e=>isRepeatOnDate(e.date,e.repeat_type,e.repeat_value,iso,e.exclude_dates,e.repeat_end_date)).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
        const allOverdue=isToday?tasks.filter(t=>{const df=diffDays(t.deadline);return df!==null&&df<0&&!t.done;}):[];
        const isEmpty=dayTasks.length===0&&dayEvents.length===0;
        return(
          <div key={iso} id={"day-"+iso} ref={isToday?scrollToRef:null}>
            <div style={{padding:"2px 0 2px"}}>
              <div onClick={()=>onEventClick({id:null,title:"",date:iso,time:"",note:""})}
                style={{display:"flex",alignItems:"center",gap:8,marginBottom:4,
                position:"sticky",top:0,zIndex:2,
                background:isToday?"#1a1a1a":"#fff",borderRadius:isToday?8:0,
                padding:isToday?"5px 12px":"2px 4px",marginLeft:isToday?-12:0,marginRight:isToday?-12:0,cursor:"pointer",
                borderBottom:"1px solid #f0f0f0"}}>
                <span style={{fontSize:12,fontWeight:700,color:dc}}>{d.getMonth()+1}/{d.getDate()}</span>
                <span style={{fontSize:10,color:isToday?"#aaa":(isSun||isHol)?"#ef4444":isSat?"#3b82f6":"#bbb"}}>{WD[d.getDay()]}{isHol?" 🎌":""}</span>
                <div style={{flex:1}}/>
                {allOverdue.length>0&&<button onClick={e=>{e.stopPropagation();onOverdueClick(allOverdue);}}
                  style={{background:"#ef4444",border:"none",borderRadius:20,padding:"2px 8px",fontSize:10,color:"#fff",fontWeight:700,cursor:"pointer"}}>超過 {allOverdue.length}件</button>}
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:4}}>
                {dayEvents.map(ev=>(
                  <div key={ev.id} onClick={()=>onEventClick({...ev,_clickedDate:iso})}
                    style={{background:"#fff",borderRadius:6,padding:"4px 8px",cursor:"pointer",border:`1px solid ${ev.border_color||"#1a1a1a"}`}}>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      {ev.time&&<span style={{fontSize:10,fontWeight:700,flexShrink:0}}>{ev.time}</span>}
                      <span style={{fontSize:11,flex:1,fontWeight:500}}>{ev.title}</span>
                      {ev.repeat_type&&<span style={{fontSize:9,color:"#6366f1"}}>🔁</span>}
                      <span style={{fontSize:9,color:"#888",flexShrink:0}}>予定</span>
                    </div>
                    {ev.note&&<div style={{fontSize:10,color:"#666",marginTop:3,whiteSpace:"pre-wrap"}}>{ev.note}</div>}
                  </div>
                ))}
                {isEmpty
                  ?<span style={{fontSize:11,color:"#ddd",alignSelf:"center",marginTop:2}}>—</span>
                  :dayTasks.map(task=>{
                    const p=proj(task.project_id);
                    const pc=task.priority===3?"#ef4444":task.priority===2?"#f97316":task.priority===1?"#10b981":"#e0e0e0";
                    return(
                      <div key={task.id} onClick={()=>onTaskClick(task)}
                        style={{background:"#f9f9f9",borderRadius:8,padding:"6px 10px",cursor:"pointer",opacity:task.done?.4:1,borderLeft:`3px solid ${pc}`}}>
                        <div style={{display:"flex",alignItems:"center",gap:6}}>
                          {p&&<span style={{fontSize:10,color:p.color,background:p.color+"18",padding:"1px 5px",borderRadius:20,flexShrink:0}}>{p.name}</span>}
                          <span style={{fontSize:12,textDecoration:task.done?"line-through":"none",color:task.done?"#bbb":"#1a1a1a"}}>{task.title}</span>
                          {task.note&&<button onClick={e=>{e.stopPropagation();onMemoClick({title:task.title,note:task.note,taskId:task.id});}}
                            style={{background:"#f0f0f0",border:"none",borderRadius:5,padding:"2px 5px",fontSize:10,cursor:"pointer",color:"#666",flexShrink:0}}>📝</button>}
                          <span style={{flex:1}}/>
                          {task.priority>0&&<span style={{fontSize:9,fontWeight:700,color:pc,flexShrink:0}}>{task.priority===3?"高":task.priority===2?"中":"低"}</span>}
                        </div>
                        {task.image_url&&<img src={task.image_url} alt="" onClick={e=>{e.stopPropagation();window.open(task.image_url,"_blank");}} style={{width:48,height:48,objectFit:"cover",borderRadius:6,marginTop:4,display:"block",cursor:"pointer"}}/>}
                      </div>
                    );
                  })
                }
              </div>
            </div>
            <div style={{height:1,background:"#f0f0f0"}}/>
          </div>
        );
      })}
    </div>
    </div>
  );
}

// ---- MonthView ----
function MemoModal({memoModal,setMemoModal,updateTask,setEvents}){
  const {useState:us}=React;
  const [note,setNote]=us(memoModal.note||"");
  const canEdit=!!(memoModal.taskId||memoModal.eventId);
  const save=async()=>{
    if(memoModal.taskId){
      await updateTask(memoModal.taskId,{note});
    }else if(memoModal.eventId){
      await SB.from("events").update({note}).eq("id",memoModal.eventId);
      setEvents(e=>e.map(x=>x.id===memoModal.eventId?{...x,note}:x));
    }
    setMemoModal(null);
  };
  return(
    <div className="dlg-ov" style={{alignItems:"center"}} onClick={()=>setMemoModal(null)}>
      <div className="dlg-in" style={{borderRadius:14,width:"min(320px,90vw)"}} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:12,fontWeight:600,marginBottom:12,color:"#1a1a1a"}}>{memoModal.title}</div>
        {canEdit?(
          <textarea value={note} onChange={e=>setNote(e.target.value)} rows={6}
            style={{width:"100%",border:"1px solid #ddd",borderRadius:8,padding:"8px 10px",fontSize:14,outline:"none",
            boxSizing:"border-box",resize:"vertical",fontFamily:"inherit",color:"#444",lineHeight:1.7}}/>
        ):(
          <div style={{fontSize:13,color:"#444",whiteSpace:"pre-wrap",lineHeight:1.7,borderTop:"1px solid #f0f0f0",paddingTop:12}}>{note}</div>
        )}
        <div style={{display:"flex",gap:8,marginTop:12}}>
          <button onClick={()=>setMemoModal(null)} style={{flex:1,background:"#f0f0f0",border:"none",borderRadius:8,padding:"10px 0",fontSize:12,cursor:"pointer",color:"#666"}}>
            {canEdit?"キャンセル":"閉じる"}
          </button>
          {canEdit&&<button onClick={save} style={{flex:1,background:"#1a1a1a",border:"none",borderRadius:8,padding:"10px 0",fontSize:12,cursor:"pointer",color:"#fff",fontWeight:600}}>保存</button>}
        </div>
      </div>
    </div>
  );
}

      background:"linear-gradient(transparent,#fafafa 60%)",paddingTop:14,paddingBottom:2,pointerEvents:"none"}}>
      <span style={{fontSize:9,color:"#888",fontWeight:600}}>▼ あと{count}件</span>
    </div>

}

function DayPopup({selDay,setSelDay,tasks,events,proj,onTaskClick,onEventClick,onMemoClick,onNewTask}){
  const {useState:us,useRef:ur}=React;
  const [animDir,setAnimDir]=us(0);
  const touchX=ur(0);
  const d=new Date(selDay+"T00:00:00");
  const isSun=d.getDay()===0,isSat=d.getDay()===6,isHol=!!HOLIDAYS[selDay];
  const dc=(isSun||isHol)?"#ef4444":isSat?"#3b82f6":"#1a1a1a";
  const dayTasks=tasks.filter(t=>t.deadline===selDay).sort((a,b)=>(b.priority||0)-(a.priority||0));
  const dayEvents=(events||[]).filter(e=>isRepeatOnDate(e.date,e.repeat_type,e.repeat_value,selDay,e.exclude_dates,e.repeat_end_date)).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
  const navigate=(dir)=>{
    setAnimDir(dir);
    setTimeout(()=>{
      const n=new Date(d);n.setDate(n.getDate()+dir);
      setSelDay(toLocal(n));
      setAnimDir(0);
    },160);
  };
  const slideStyle=animDir===0?{transition:"transform .16s ease,opacity .16s ease"}
    :{transform:`translateX(${animDir>0?-60:60}px)`,opacity:0,transition:"transform .16s ease,opacity .16s ease"};

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.4)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>setSelDay(null)}>
      <div style={{background:"#fff",borderRadius:14,padding:"16px",width:"min(320px,90vw)",height:"67vh",maxHeight:"67vh",display:"flex",flexDirection:"column"}}
        onClick={e=>e.stopPropagation()}
        onTouchStart={e=>{touchX.current=e.touches[0].clientX;}}
        onTouchEnd={e=>{const dx=e.changedTouches[0].clientX-touchX.current;if(dx>60)navigate(-1);else if(dx<-60)navigate(1);}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:12,flexShrink:0}}>
          <button onClick={()=>navigate(-1)} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#888",padding:"0 4px",lineHeight:1}}>‹</button>
          <div style={{fontWeight:700,fontSize:14,flex:1,textAlign:"center",color:dc,...slideStyle}}>
            {d.getMonth()+1}月{d.getDate()}日（{WD[d.getDay()]}）
          </div>
          <button onClick={()=>navigate(1)} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:"#888",padding:"0 4px",lineHeight:1}}>›</button>
          <button onClick={()=>{onEventClick({id:null,title:"",date:selDay,time:"",note:""});setSelDay(null);}}
            style={{background:"#555",color:"#fff",border:"none",borderRadius:20,padding:"4px 8px",fontSize:11,cursor:"pointer",flexShrink:0}}>📅</button>
          <button onClick={()=>{onNewTask(selDay);setSelDay(null);}}
            style={{background:"#1a1a1a",color:"#fff",border:"none",borderRadius:20,padding:"4px 8px",fontSize:11,cursor:"pointer",flexShrink:0}}>＋タスク</button>
        </div>
        <div style={{overflowY:"auto",flex:1,minHeight:"calc(5 * 44px)",...slideStyle}}>
          {dayEvents.length===0&&dayTasks.length===0&&<div style={{color:"#ddd",fontSize:12,textAlign:"center",padding:"20px 0"}}>予定・タスクなし</div>}
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {dayEvents.map(ev=>(
              <div key={ev.id} onClick={()=>{onEventClick({...ev,_clickedDate:selDay});setSelDay(null);}}
                style={{background:"#f9f9f9",borderRadius:8,padding:"8px 10px",cursor:"pointer",border:`1.5px solid ${ev.border_color||"#1a1a1a"}`}}>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  {ev.time&&<span style={{fontSize:11,fontWeight:700}}>{ev.time}</span>}
                  <span style={{fontSize:11,flex:1,fontWeight:500}}>{ev.title}</span>
                  {ev.note&&<button onClick={e=>{e.stopPropagation();onMemoClick({title:ev.title,note:ev.note,eventId:ev.id});}}
                    style={{background:"#f0f0f0",border:"none",borderRadius:5,padding:"2px 6px",fontSize:10,cursor:"pointer",color:"#666",flexShrink:0}}>📝</button>}
                  <span style={{fontSize:9,color:"#888",flexShrink:0}}>予定</span>
                </div>
              </div>
            ))}
            {dayTasks.map(task=>{
              const p=proj(task.project_id);
              const pc=task.priority===3?"#ef4444":task.priority===2?"#f97316":task.priority===1?"#10b981":"#e0e0e0";
              return(
                <div key={task.id} onClick={()=>{onTaskClick(task);setSelDay(null);}}
                  style={{background:"#f9f9f9",borderRadius:8,padding:"8px 10px",cursor:"pointer",borderLeft:`3px solid ${pc}`,opacity:task.done?.5:1}}>
                  <div style={{display:"flex",gap:6,alignItems:"center"}}>
                    {p&&<span style={{fontSize:10,color:p.color,background:p.color+"18",padding:"1px 5px",borderRadius:20,flexShrink:0}}>{p.name}</span>}
                    <span style={{fontSize:12,flex:1,textDecoration:task.done?"line-through":"none"}}>{task.title}</span>
                    {task.note&&<button onClick={e=>{e.stopPropagation();onMemoClick({title:task.title,note:task.note,taskId:task.id});}}
                      style={{background:"#f0f0f0",border:"none",borderRadius:5,padding:"2px 6px",fontSize:10,cursor:"pointer",color:"#666",flexShrink:0}}>📝</button>}
                    {task.priority>0&&<span style={{fontSize:9,fontWeight:700,color:pc,flexShrink:0}}>{task.priority===3?"高":task.priority===2?"中":"低"}</span>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
        <button onClick={()=>setSelDay(null)} style={{marginTop:14,width:"100%",background:"#f0f0f0",border:"none",borderRadius:8,padding:"10px 0",fontSize:12,cursor:"pointer",color:"#666",flexShrink:0}}>閉じる</button>
      </div>
    </div>
  );
}

function MonthRenderCell({d,iso,isToday,isSel,isSat,isSun,isHol,isThisWeek,allItems,onClick}){
  // 土日祝は今日でも色を保持
  const bg=!d?"#ebebeb"
    :isSel?"#eef0ff"
    :isSat?"#e8f4ff"
    :isSun||isHol?"#fff0f0"
    :isToday?"#fff"
    :isThisWeek?"#fff"
    :"#f5f5f5";
  return(
    <div onClick={onClick}
      style={{padding:"2px",background:bg,
      boxShadow:isToday?"inset 0 0 0 2px #1a1a1a":"none",
      cursor:iso?"pointer":"default",overflow:"hidden",height:"100%"}}>
      {d!=null&&<div style={{fontSize:10,fontWeight:700,width:18,height:18,borderRadius:"50%",
        background:isToday&&!isSat&&!isSun&&!isHol?"#1a1a1a":"transparent",
        color:isToday&&!isSat&&!isSun&&!isHol?"#fff":isSun||isHol?"#ef4444":isSat?"#3b82f6":"#444",
        display:"flex",alignItems:"center",justifyContent:"center",marginBottom:1}}>{d}</div>}
      {(allItems||[]).slice(0,5).map((item,ii)=>{
        if(item.type==="ev"){const ev=item.data;return(
          <div key={"e"+ii} style={{fontSize:9,background:item.data.border_color||"#1a1a1a",color:"#fff",borderRadius:2,padding:"1px 3px",marginBottom:1,wordBreak:"break-all",lineHeight:1.4}}>
            {ev.time&&<span>{ev.time} </span>}{ev.title}</div>);}
        const task=item.data;
        const pc=task.priority===3?"#ef4444":task.priority===2?"#f97316":task.priority===1?"#10b981":"#888";
        return(<div key={"t"+ii} style={{fontSize:9,background:pc+"22",color:"#1a1a1a",borderRadius:2,padding:"1px 3px",marginBottom:1,wordBreak:"break-all",lineHeight:1.4,opacity:task.done?.5:1}}>{task.title}</div>);
      })}
      {(allItems||[]).length>5&&<div style={{fontSize:6,color:"#aaa"}}>+{(allItems||[]).length-5}</div>}
    </div>
  );
}

function MonthView({tasks,events,proj,onTaskClick,onEventClick,onMemoClick,selDay,setSelDay}){
  const today=todayISO();
  const now=new Date();
  const WDS=["月","火","水","木","金","土/日"];

  const startBase=new Date(now.getFullYear(),now.getMonth()-6,1);
  const endBase=new Date(now.getFullYear(),now.getMonth()+13,0);
  let cur=new Date(startBase);
  const dow0=(cur.getDay()+6)%7;
  cur.setDate(cur.getDate()-dow0);

  const weeks=[];
  let todayWeekIdx=-1;
  while(cur<=endBase){
    const cells=[];
    for(let i=0;i<7;i++){
      const d=new Date(cur);
      const iso=toLocal(d);
      if(iso===today)todayWeekIdx=weeks.length;
      cells.push({d:d.getDate(),month:d.getMonth(),year:d.getFullYear(),iso});
      cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+1);
    }
    weeks.push(cells);
  }

  const todayRef=useRef(null);
  useEffect(()=>{
    const t=setTimeout(()=>{
      if(todayRef.current){
        todayRef.current.scrollIntoView({block:"center"});
        // 1段上にずらす
        const parent=todayRef.current.closest('[style*="overflow-y"]')||todayRef.current.parentElement;
        if(parent)parent.scrollTop+=200;
      }
    },300);
    return()=>clearTimeout(t);
  },[]);

  const getItems=(iso)=>{
    if(!iso)return[];
    const dayTasks=tasks.filter(t=>t.deadline===iso).sort((a,b)=>(b.priority||0)-(a.priority||0));
    const dayEvents=(events||[]).filter(e=>isRepeatOnDate(e.date,e.repeat_type,e.repeat_value,iso,e.exclude_dates,e.repeat_end_date)).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
    return[...dayEvents.map(e=>({type:"ev",data:e})),...dayTasks.map(t=>({type:"tk",data:t}))];
  };

  const BDR="2px solid #bbb";
  const THIN="1px solid #aaa";

  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",background:"#fff"}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr) 0.9fr",flexShrink:0,borderBottom:"2px solid #ccc",background:"#fafafa"}}>
        {WDS.map((d,i)=>(
          <div key={i} style={{textAlign:"center",fontSize:10,padding:"3px 0",fontWeight:600,color:i===5?"#888":"#666"}}>{d}</div>
        ))}
      </div>
      <div style={{flex:1,overflowY:"auto",paddingBottom:80}}>
        {weeks.map((cells,wi)=>{
          const isThisWeek=wi===todayWeekIdx;
          const firstCell=cells.find(c=>c.d===1);
          const isMonthStart=!!firstCell;
          const firstCol=isMonthStart?cells.indexOf(firstCell):-1;
          // 土日列は5
          const firstColAdj=isMonthStart?Math.min(firstCol,5):-1;
          const isCurrentMonth=firstCell&&firstCell.year===now.getFullYear()&&firstCell.month===now.getMonth();

          // クランク線：月初側=月名の上に黒線、月末側=線なし、1日列の左辺に黒線
          const getTopBorder=(col)=>"none";
          const getBottomBorder=(col)=>isMonthStart&&col<firstColAdj?BDR:"none";
          const getLeftBorder=(col)=>{
            if(col===0)return "none";
            if(isMonthStart&&col===firstColAdj)return BDR;
            return THIN;
          };

          return(
            <div key={wi} ref={isThisWeek?todayRef:null} id={isThisWeek?"month-today":undefined}>
              {isMonthStart&&(
                <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr) 0.9fr",background:"#f0f0f0"}}>
                  {[0,1,2,3,4,5].map(ci=>(
                    <div key={ci} style={{
                      borderTop:ci>=firstColAdj?BDR:"none",
                      borderLeft:ci>0&&ci===firstColAdj?BDR:ci>0?THIN:"none",
                      display:"flex",alignItems:"center",
                      padding:"4px 6px",fontSize:11,fontWeight:700,color:"#333",
                      minHeight:22,background:"#f0f0f0",justifyContent:"center"}}>
                      {ci===firstColAdj?`${firstCell.year}/${firstCell.month+1}`:""}
                    </div>
                  ))}
                </div>
              )}
              <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr) 0.9fr",
                borderBottom:"1px solid #aaa",minHeight:100}}>
                {cells.slice(0,5).map((cell,di)=>(
                  <div key={di} style={{
                    borderLeft:getLeftBorder(di),
                    borderTop:"none",
                    borderBottom:getBottomBorder(di)}}>
                    <MonthRenderCell d={cell.d} iso={cell.iso} isToday={cell.iso===today} isSel={cell.iso===selDay}
                      isSat={false} isSun={false} isHol={!!(cell.iso&&HOLIDAYS[cell.iso])}
                      isThisWeek={isThisWeek} allItems={getItems(cell.iso)}
                      onClick={()=>cell.iso&&setSelDay(cell.iso)}/>
                  </div>
                ))}
                <div style={{
                  borderLeft:getLeftBorder(5),
                  borderTop:"none",
                  borderBottom:getBottomBorder(5),
                  display:"flex",flexDirection:"column"}}>
                  {[cells[5],cells[6]].map((cell,si)=>(
                    <div key={si} style={{flex:1,borderBottom:si===0?THIN:"none"}}>
                      <MonthRenderCell d={cell.d} iso={cell.iso} isToday={cell.iso===today} isSel={cell.iso===selDay}
                        isSat={si===0} isSun={si===1} isHol={!!(cell.iso&&HOLIDAYS[cell.iso])}
                        isThisWeek={isThisWeek} allItems={getItems(cell.iso)}
                        onClick={()=>cell.iso&&setSelDay(cell.iso)}/>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}









function App(){

  const [selProj,setSelProj]=useState(null);

  const [showAddMenu,setShowAddMenu]=useState(false);

  const [projListItems,setProjListItems]=useState([]);

  useEffect(()=>{
    SB.from("projects_list").select("*").order("created_at").then(({data})=>setProjListItems(data||[]));
    SB.from("project_steps").select("*").then(({data})=>{
      if(!data)return;
      const map={};
      data.forEach(s=>{if(!map[s.task_id])map[s.task_id]=[];map[s.task_id].push(s);});
      setProjListSteps(map);
    });
  },[]);
  const upperPanelRef=useRef(null);
  const [upperHiddenCount,setUpperHiddenCount]=useState(0);
  useEffect(()=>{
    const el=upperPanelRef.current;
    if(!el)return;
    const check=()=>{
      const remaining=el.scrollHeight-el.clientHeight-el.scrollTop;
      setUpperHiddenCount(Math.max(0,Math.round(remaining/34)));
    };
    el.addEventListener('scroll',check);
    setTimeout(check,200);
    return()=>el.removeEventListener('scroll',check);
  },[]);
  const [scrollTarget,setScrollTarget]=useState("today");
  const calScrollRef=useRef(null);

  useEffect(()=>{
    Promise.all([
      SB.from("projects").select("*").order("position"),
      SB.from("tasks").select("*").order("created_at",{ascending:false}).limit(500),
      SB.from("events").select("*").order("date")
    ]).then(([{data:ps},{data:ts},{data:es}])=>{
      setProjects(ps||[]);setTasks(ts||[]);setEvents(es||[]);setLoading(false);
    });
    let pS,tS,eS;
    const start=()=>{
      pS=SB.channel("p").on("postgres_changes",{event:"*",schema:"public",table:"projects"},
        ()=>SB.from("projects").select("*").order("position").then(({data})=>setProjects(data||[]))).subscribe();
      tS=SB.channel("t").on("postgres_changes",{event:"*",schema:"public",table:"tasks"},
        ()=>SB.from("tasks").select("*").order("created_at",{ascending:false}).limit(500).then(({data})=>setTasks(data||[]))).subscribe();
      eS=SB.channel("e").on("postgres_changes",{event:"*",schema:"public",table:"events"},
        ()=>SB.from("events").select("*").order("date").then(({data})=>setEvents(data||[]))).subscribe();
    };
    const stop=()=>{if(pS)SB.removeChannel(pS);if(tS)SB.removeChannel(tS);if(eS)SB.removeChannel(eS);};
    start();
    const onVis=()=>{
      if(document.hidden){stop();}
      else{
        Promise.all([
          SB.from("projects").select("*").order("position"),
          SB.from("tasks").select("*").order("created_at",{ascending:false}).limit(500),
          SB.from("events").select("*").order("date")
        ]).then(([{data:ps},{data:ts},{data:es}])=>{setProjects(ps||[]);setTasks(ts||[]);setEvents(es||[]);});
        start();
      }
    };
    document.addEventListener("visibilitychange",onVis);
    return()=>{stop();document.removeEventListener("visibilitychange",onVis);};
  },[]);

  // 起動時に今日へスクロール
  useEffect(()=>{if(!loading){setScrollTarget(null);setTimeout(()=>setScrollTarget("today"),100);}},  [loading]);

  // scrollTarget変化時にスクロール
  useEffect(()=>{
    if(!scrollTarget)return;
    const id=scrollTarget==="today"
      ?(viewMode==="monthly"?"month-today":"day-"+todayISO())
      :"day-"+scrollTarget;
    const doScroll=()=>{
      const el=document.getElementById(id);
      if(!el)return;
      if(viewMode==="monthly"){
        el.scrollIntoView({block:"center"});
        const parent=el.closest('div[style*="overflow-y"]')||el.parentElement;
        if(parent)parent.scrollTop+=200;
      }else{
        el.scrollIntoView({block:"start"});
      }
    };
    const t1=setTimeout(doScroll,300);
    const t2=setTimeout(doScroll,900);
    return()=>{clearTimeout(t1);clearTimeout(t2);};
  },[scrollTarget,viewMode]);

  const proj=id=>projects.find(p=>p.id===id);

  // プロジェクト操作
  const addProject=async()=>{
    if(!newProjName.trim())return;
    const color=COLORS[projects.length%COLORS.length];
    const {data}=await SB.from("projects").insert({id:uid(),name:newProjName.trim(),color,position:projects.length}).select().single();
    if(data)setProjects(p=>[...p,data]);
    setNewProjName("");setAddingProj(false);
  };
  const delProject=async id=>{
    const pt=tasks.filter(t=>t.project_id===id);
    const other=projects.filter(p=>p.id!==id);
    if(pt.length>0){
      if(other.length===0){alert("タスクがあるため削除できません。先にタスクを削除してください。");return;}
      if(!confirm(`${pt.length}件のタスクを「${other[0].name}」に移動して削除しますか？`))return;
      await SB.from("tasks").update({project_id:other[0].id}).eq("project_id",id);
      setTasks(t=>t.map(x=>x.project_id===id?{...x,project_id:other[0].id}:x));
    }else{if(!confirm("削除しますか？"))return;}
    await SB.from("projects").delete().eq("id",id);
    setProjects(p=>p.filter(x=>x.id!==id));
    if(selProj===id)setSelProj(null);
  };
  const renameProject=async(id,name)=>{
    if(!name.trim())return;
    await SB.from("projects").update({name:name.trim()}).eq("id",id);
    setProjects(p=>p.map(x=>x.id===id?{...x,name:name.trim()}:x));
    setEditingProjId(null);
  };

  // タスク操作
  const updateTask=async(id,fields)=>{
    await SB.from("tasks").update(fields).eq("id",id);
    setTasks(t=>t.map(x=>x.id===id?{...x,...fields}:x));
  };
  const handleCheck=task=>{
    if(!task.done)setConfirmTask({...task,type:"done"});
    else updateTask(task.id,{done:false});
  };
  const confirmAction=async()=>{
    if(!confirmTask)return;
    if(confirmTask.type==="done"){
      if(confirmTask.repeat_type){
        const next=nextDeadline(confirmTask.deadline,confirmTask.repeat_type,confirmTask.repeat_value);
        await updateTask(confirmTask.id,{deadline:next,done:false});
      }else await updateTask(confirmTask.id,{done:true});
    }else{
      await SB.from("tasks").delete().eq("id",confirmTask.id);
      setTasks(t=>t.filter(x=>x.id!==confirmTask.id));
    }
    setConfirmTask(null);
  };
  const saveTask=async()=>{
    if(!editTask||!editTask.title.trim())return;
    const fields={title:editTask.title.trim(),project_id:editTask.project_id,
      deadline:editTask.deadline||null,repeat_type:editTask.repeat_type||null,
      repeat_value:editTask.repeat_value||null,note:editTask.note||null,priority:editTask.priority||0};
    const targetDate=editTask.deadline||todayISO();
    if(editTask.id===null){
      const {data}=await SB.from("tasks").insert({id:uid(),done:false,...fields}).select().single();
      if(data)setTasks(t=>[data,...t]);

    setScrollTarget(null);setTimeout(()=>{const el=document.getElementById("day-"+targetDate);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});},150);

  const addProjInDialog=async()=>{
    if(!newProjInDialogName.trim())return;
    const color=COLORS[projects.length%COLORS.length];
    const {data}=await SB.from("projects").insert({id:uid(),name:newProjInDialogName.trim(),color,position:projects.length}).select().single();
    if(data){setProjects(p=>[...p,data]);setEditTask(t=>({...t,project_id:data.id}));}

  };

  // イベント操作
  const saveEvent=async()=>{
    if(!editEvent||!editEvent.title.trim()||!editEvent.date)return;
    const targetDate=editEvent.date;
    const fields={title:editEvent.title.trim(),date:targetDate,time:editEvent.time||null,
      note:editEvent.note||null,repeat_type:editEvent.repeat_type||null,
      repeat_value:editEvent.repeat_value||null,
      border_color:editEvent.border_color||null};
    if(editEvent.id===null){
      const newEv={id:uid(),...fields};
      const {data}=await SB.from("events").insert(newEv).select().single();
      setEvents(e=>[...e,data||newEv].sort((a,b)=>a.date.localeCompare(b.date)));
    }else{
      await SB.from("events").update(fields).eq("id",editEvent.id);
      setEvents(e=>e.map(x=>x.id===editEvent.id?{...x,...fields}:x));
    }
    setEditEvent(null);
    setScrollTarget(null);setTimeout(()=>{const el=document.getElementById("day-"+targetDate);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});},150);
  };
  const delEvent=async(id,repeatType,originalId)=>{
    if(repeatType){

      setRepeatDeleteModal({id,title:editEvent?.title||"",originalId:originalId||id,date:clickedDate});

    }
    await SB.from("events").delete().eq("id",id);
    setEvents(e=>e.filter(x=>x.id!==id));

    if(!repeatDeleteModal)return;
    const {id,date}=repeatDeleteModal;
    if(mode==="this"){
      // この日付だけexclude_datesに追加
      const ev=events.find(x=>x.id===id);
      if(ev){
        const existing=(ev.exclude_dates||"").split(",").filter(Boolean);
        if(!existing.includes(date))existing.push(date);
        const newExclude=existing.join(",");
        await SB.from("events").update({exclude_dates:newExclude}).eq("id",id);
        setEvents(e=>e.map(x=>x.id===id?{...x,exclude_dates:newExclude}:x));
      }
    }else{
      // この日以降を削除：repeat_end_dateを前日に設定
      const prev=new Date(date+"T00:00:00");
      prev.setDate(prev.getDate()-1);
      const endDate=toLocal(prev);
      if(endDate<(events.find(x=>x.id===id)?.date||"")){
        // 開始日より前なら完全削除
        await SB.from("events").delete().eq("id",id);
        setEvents(e=>e.filter(x=>x.id!==id));
      }else{
        await SB.from("events").update({repeat_end_date:endDate}).eq("id",id);
        setEvents(e=>e.map(x=>x.id===id?{...x,repeat_end_date:endDate}:x));

    if(selProj&&t.project_id!==selProj)return false;
    if(filter==="active"&&t.done)return false;
    if(filter==="done"&&!t.done)return false;
    return true;
  }).sort((a,b)=>{const da=diffDays(a.deadline)??9999,db=diffDays(b.deadline)??9999;return da-db||new Date(a.created_at)-new Date(b.created_at);});

  const reminders=tasks.filter(t=>!t.done&&!dismissed[t.id]&&(t.priority||0)>0)
    .sort((a,b)=>(b.priority||0)-(a.priority||0)||diffDays(a.deadline)-diffDays(b.deadline));

  const remColor=diff=>{
    if(diff===null||diff>3)return{bg:"#fffbeb",border:"#fde68a",dot:"#f59e0b",text:"#f59e0b"};
    if(diff<=0)return{bg:"#fff5f5",border:"#fecaca",dot:"#ef4444",text:"#ef4444"};
    if(diff<=1)return{bg:"#fff7ed",border:"#fed7aa",dot:"#f97316",text:"#f97316"};
    return{bg:"#fffbeb",border:"#fde68a",dot:"#f59e0b",text:"#f59e0b"};
  };

  const openTaskMenu=t=>{setTaskMenu(t);setShowAddMenu(false);};
